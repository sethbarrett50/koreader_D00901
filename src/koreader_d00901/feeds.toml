# Feed list for KOReader's News Downloader, installed on every unit as koreader/news/feed_config.lua.
# Edit here, not on the Kindles, then run `koreader-d00901 --only feeds` per unit.
#
# Fields: name, section (security | engineering | research), url,
#   limit      max items per sync (0 = no limit)
#   max_age    skip items older than this, e.g. "7d", "2w" (the feed must carry dates)
#   full_article  fetch the whole web page instead of the feed text (slower on a K3)
#   enabled    false = written to the Kindle commented out, ready to switch on
#   check      false = skip in the weekly CI check (for sites that block automated clients)
#
# Verified 2026-11-05: every URL below returned 200 and parsed as RSS/Atom with dated items,
# except CISA, which returns 403 to non-browser clients (see its note).

# Security: act on these. Small limits, recent items only.

[[feed]]
name = "CISA cybersecurity alerts"
section = "security"
url = "https://www.cisa.gov/cybersecurity-advisories/alerts.xml"
limit = 5
max_age = "7d"
check = false
note = "Returned 403 to automated clients during verification; if the Kindle gets the same, set enabled = false."

[[feed]]
name = "Debian security advisories (full text)"
section = "security"
url = "https://www.debian.org/security/dsa-long"
limit = 10
max_age = "7d"

[[feed]]
name = "SANS Internet Storm Center"
section = "security"
url = "https://isc.sans.edu/rssfeed_full.xml"
limit = 5
max_age = "7d"

