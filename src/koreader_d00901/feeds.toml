# Research: a few papers a week, screened by title and abstract.

[[feed]]
name = "arXiv cs.LG: concept drift and intrusion detection"
section = "research"
url = "https://export.arxiv.org/api/query?search_query=cat:cs.LG+AND+(abs:%22concept+drift%22+OR+abs:%22intrusion+detection%22)&sortBy=submittedDate&sortOrder=descending&max_results=15"
limit = 5
max_age = "14d"
note = "Targeted query instead of all of cs.LG (about 445 papers and 936 KB per day)."

[[feed]]
name = "arXiv cs.CR (security)"
section = "research"
url = "https://rss.arxiv.org/rss/cs.CR"
limit = 5
max_age = "3d"

[[feed]]
name = "JMLR"
section = "research"
url = "https://www.jmlr.org/jmlr.xml"
limit = 3
max_age = "30d"

[[feed]]
name = "Google Research blog"
section = "research"
url = "https://research.google/blog/rss/"
limit = 3
max_age = "30d"

# Off by default: switch one on when a project gives you a reason to follow it.

[[feed]]
