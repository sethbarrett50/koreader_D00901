[project]
name = "koreader_D00901"
version = "0.1.0"
description = "Install KOReader on a Kindle Keyboard (K3) from Linux."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Seth Barrett" }]
dependencies = [
    "textual>=8.2,<9",
]

[project.scripts]
koreader-d00901 = "koreader_d00901.cli:main"
koreader-d00901-tui = "koreader_d00901.tui:main"

[build-system]
requires = ["uv_build>=0.9,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "koreader_d00901"

[dependency-groups]
dev = [
  "ruff>=0.15.15,<1.0.0",
  "ty>=0.0.97,<0.1.0",
  "pytest>=9.0.3,<10.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ty.environment]
python-version = "3.12"
