[project]
name = "koreader_D00901"
version = "0.4.0"
description = "Install KOReader on a Kindle Keyboard (K3) from Linux."
readme = "README.md"
requires-python = ">=3.14"
authors = [{ name = "Seth Barrett" }]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["kindle", "koreader", "kindle-keyboard", "k3", "jailbreak", "e-reader"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: System :: Installation/Setup",
]
dependencies = [
    "textual>=8.2,<9",
]

[project.urls]
Homepage = "https://github.com/sethbarrett50/koreader_D00901"
Issues = "https://github.com/sethbarrett50/koreader_D00901/issues"

[project.scripts]
koreader-d00901 = "koreader_d00901.cli:main"
koreader-d00901-tui = "koreader_d00901.tui:main"
koreader-d00901-battery = "koreader_d00901.battery:main"
koreader-d00901-dashboard = "koreader_d00901.dashboard:main"

[project.optional-dependencies]
dashboard = [
    "pillow>=12,<13",
]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "koreader_d00901"

[dependency-groups]
dev = [
  "ruff>=0.15.15,<1.0.0",
  "ty>=0.0.97,<0.1.0",
  "pytest>=9.0.3,<10.0.0",
  "lupa>=2.4,<3",
  "pillow>=12,<13",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ty.environment]
python-version = "3.14"
