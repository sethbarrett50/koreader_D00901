[project]
name = "k3-koreader-installer"
version = "0.1.0"
description = "Install KOReader on a Kindle Keyboard (K3) from Linux."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Seth Barrett" }]
dependencies = []

[tool.uv]
package = false

[dependency-groups]
dev = [
  "ruff>=0.15.15,<1.0.0",
  "ty>=0.0.97,<0.1.0",
  "pytest>=9.0.3,<10.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ty.environment]
python-version = "3.12"
