name: Release

# Push a tag vX.Y.Z matching the version in pyproject.toml to publish to PyPI.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.14"

      - name: Check the tag matches the package version
        run: |
          version="$(uv version --short)"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match pyproject version ${version}"
            exit 1
          fi

      - name: Checks
        run: |
          uv sync --frozen --dev
          make ci

      - name: Build
        run: make build

      - name: Smoke-test the wheel
        run: make smoke

      - name: Upload dist
        uses: actions/upload-artifact@v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/koreader-d00901
    permissions:
      id-token: write  # PyPI trusted publishing (OIDC); no API token is stored
    steps:
      - name: Download dist
        uses: actions/download-artifact@v8.0.2
        with:
          name: dist
          path: dist/

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3

      - name: Publish to PyPI
        run: uv publish --trusted-publishing always dist/*
