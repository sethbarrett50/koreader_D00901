name: Pin check

# Weekly: re-download every package pinned in packages.json, verify its sha256, and check it still
# holds every file the installer stages for each serial prefix and firmware range. Runs on a
# schedule rather than per PR so upstream drift never blocks unrelated work.
on:
  schedule:
    - cron: "17 6 * * 1"  # Mondays 06:17 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - src/koreader_d00901/packages.json
      - src/koreader_d00901/plan.py
      - src/koreader_d00901/pins.py
      - .github/workflows/pins.yml

permissions:
  contents: read

jobs:
  pins:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write  # open or update the drift issue on failure
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.14"

      - name: Check pinned packages
        id: check
        run: |
          set -o pipefail
          uv run --frozen python -m koreader_d00901.pins 2>&1 | tee pins.log

      - name: Open or update the drift issue
        if: failure() && steps.check.outcome == 'failure' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Pinned upstream package check failed"
          {
            echo "The scheduled pin check failed: ${RUN_URL}"
            echo
            echo '```'
            tail -n 40 pins.log
            echo '```'
            echo
            echo "Update the pin in src/koreader_d00901/packages.json (url, sha256, filename) after checking the new upstream file, or fix the member names in plan.py."
          } > body.md
          number="$(gh issue list --state open --search "in:title \"${title}\"" --json number --jq '.[0].number')"
          if [ -n "${number}" ]; then
            gh issue comment "${number}" --body-file body.md
          else
            gh issue create --title "${title}" --body-file body.md
          fi
